				<div class="header-service">
					<div class="service-item"><i class="fas fa-calendar-day"></i><strong id="todayText">课程实践</strong><span>表单验证</span></div>
					<div class="service-item"><i class="fas fa-user-check"></i><strong>注册登录</strong><span>本地演示</span></div>
					<a class="cart-entry" href="cart.html"><i class="fas fa-shopping-cart"></i>购物车<em id="cartCount">0</em></a>
				</div>
			</div>
		</header>

		<nav class="main-nav">
			<div class="page-wrap">

		<main class="form-page page-wrap">
			<div class="form-card">
				<h2>会员登录</h2>
				<form id="loginForm">
					<label>账号<input type="text" id="loginName" placeholder="请输入账号"></label>
					<label>密码<input type="password" id="loginPwd" placeholder="请输入密码"></label>
					<button type="submit">登录</button>
					<p id="loginMsg" class="form-msg"></p>
				</form>
			</div>
			<div class="form-card">
				<h2>新用户注册</h2>
				<form id="registerForm">
					<label>账号<input type="text" id="regName" placeholder="4-16 位账号"></label>
					<label>邮箱<input type="text" id="regEmail" placeholder="example@mail.com"></label>
					<label>密码<input type="password" id="regPwd" placeholder="至少 6 位"></label>
					<label>确认密码<input type="password" id="regPwd2" placeholder="再次输入密码"></label>
					<button type="submit">注册</button>
					<p id="regMsg" class="form-msg"></p>
				</form>
			</div>
		</main>

		<footer class="site-footer">
